# OpenSpec configuration — project: vitale-old
# Generated by sdd-init (hybrid persistence). Keep context short; this is an index for SDD phases.
# Corrected 2026-10-16 by change harden-conversion-flow (phase 0): the previous record claimed no test
# runner existed. It does — see the testing block below.
# Updated 2026-10-18 by change editable-markdown-output: 7 suites / 71 passing (baseline 6/63 plus the new suite).

schema: spec-driven
strict_tdd: true

context: |
  Project: Vitale-Old — 100% client-side HTML/MHTML -> Markdown converter.
  Stack: plain HTML + CSS + browser scripts. No build step, no framework, no bundler.
  Architecture: single global namespace window.Vitale. Each module is an IIFE exposing one Vitale.* key.
  Load order: <script> order in index.html is the only dependency injection (core -> extractors -> services -> panels -> main).
  Layout: index.html, styles.css, js/{core,extractors,*panels}.js, js/{platform,site-detector,mdream-loader,download-modal}.js, legacy in old/v1 and old/v2.
  Testing: 7 Node test suites in tests/ (71 passing). Headless — the suites stub browser globals. DOM/focus behaviour needs a browser.
  Style: Spanish code comments with ASCII-box headers; escape all dynamic innerHTML values via Vitale.utils.esc().

testing:
  runner: node
  framework: ""
  command: 'Get-ChildItem tests\*.test.js | ForEach-Object { node $_.FullName }'
  command_posix: 'for f in tests/*.test.js; do node "$f"; done'
  layers:
    unit: true
    integration: false
    e2e: false
  coverage: false
  coverage_command: ""
  linter: false
  type_checker: false
  formatter: false
  suite_count: 7
  baseline_passing: 71
  syntax_check: 'node --check <file>'
  note: "Node is the runner (no package.json). 7 suites / 71 passing. The suites stub browser globals (global.alert, scrollIntoView, ...), so pure logic is testable headlessly; DOM and focus behaviour must be verified in a browser. No linter, type checker, formatter, or coverage tool exists — `node --check` is the only automated static gate."

rules:
  proposal:
    - Include rollback plan for risky changes
    - Reference the README "Limitaciones conocidas" table when a change maps to a listed bug
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Respect the window.Vitale namespace and the one-IIFE-one-key module contract
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns (IIFE assigning exactly one window.Vitale key)
    - Register any new script in index.html in the correct load-order section
    - Escape every dynamic value passed to innerHTML with Vitale.utils.esc()
    tdd: true
    test_command: 'Get-ChildItem tests\*.test.js | ForEach-Object { node $_.FullName }'
    strict_tdd_note: "Write the failing test first (RED), then the fix (GREEN). Dead-code removal and pure refactors cannot produce a RED — declare those as refactors covered by the existing suite instead of inventing a failing test."
  verify:
    - Run the full suite (baseline 71 passing; none may be removed)
    - DOM, focus, and screen-reader behaviour cannot be verified headlessly — verify those in a browser and document the steps
    test_command: 'Get-ChildItem tests\*.test.js | ForEach-Object { node $_.FullName }'
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
